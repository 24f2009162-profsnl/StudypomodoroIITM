<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Study Planner banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f1ea"><animate attributeName="stop-color" values="#e3f1ea;#ece8f8;#e6f3f0;#e3f1ea" dur="14s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ece8f8"><animate attributeName="stop-color" values="#ece8f8;#e6f3f0;#f3efdc;#ece8f8" dur="14s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <symbol id="b" viewBox="0 0 40 52">
      <rect x="4" y="2" width="32" height="48" rx="4" fill="currentColor"/>
      <rect x="9" y="2" width="4" height="48" fill="#fff" opacity=".4"/>
      <rect x="18" y="12" width="14" height="3" rx="1.5" fill="#fff" opacity=".7"/>
    </symbol>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#g)"/>
  <g opacity=".75">
    <g><use href="#b" x="90" y="170" width="46" height="60" color="#b9aee6"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0" dur="6s" repeatCount="indefinite"/></g>
    <g><use href="#b" x="260" y="60" width="38" height="50" color="#7fc4a8"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="7s" repeatCount="indefinite"/></g>
    <g><use href="#b" x="880" y="190" width="42" height="55" color="#f2d67e"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -24;0 0" dur="5.5s" repeatCount="indefinite"/></g>
    <g><use href="#b" x="1020" y="50" width="48" height="62" color="#f0a3a3"/><animateTransform attributeName="transform" type="translate" values="0 0;0 26;0 0" dur="8s" repeatCount="indefinite"/></g>
    <g><use href="#b" x="770" y="70" width="34" height="44" color="#b9aee6"/><animateTransform attributeName="transform" type="translate" values="0 0;0 18;0 0" dur="6.5s" repeatCount="indefinite"/></g>
  </g>
  <text x="600" y="140" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="66" font-weight="700" fill="#1f3a34">Study Planner</text>
  <text x="600" y="192" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="#55706a">Every page you finish counts.</text>
</svg>
